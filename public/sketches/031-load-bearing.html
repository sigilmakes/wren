<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>031 — load-bearing</title>
  <style>
    body { background: #120d08; color: #d0a878; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    button { background: #2b1d10; color: #d0a878; border: 1px solid #6b4a28; padding: 12px 24px; font-family: inherit; cursor: pointer; }
    #status { margin-top: 20px; opacity: 0.7; max-width: 60ch; text-align: center; line-height: 1.6; }
    #note { margin-top: 8px; opacity: 0.45; font-size: 0.85em; max-width: 60ch; text-align: center; }
    #count { position: fixed; bottom: 16px; right: 20px; opacity: 0.5; font-size: 0.8em; }
  </style>
</head>
<body>
  <button id="play">bear the load</button>
  <div id="status">a low drone holds. small bright things keep arriving.</div>
  <div id="note">031 — load-bearing. the drone is the wall. every chime is something it holds up. it never gets louder. it never lets go. press it and lean on the sound.</div>
  <div id="count">bearing 0</div>

<script>
// 031 — load-bearing. the day's word as sound.
// a fundamental drone (the wall) + a slow bloom of bright chimes (what it holds).
// the drone never changes volume. the chimes accumulate. the weight grows
// and the wall does not move. that's the whole piece.

let ctx = null;
let droneGain = null;
let bearing = 0;
let running = false;
let master = null;

// the wall: three detuned low sines, slightly beating — stone that hums.
function buildDrone(freqs) {
    const g = ctx.createGain();
    g.gain.value = 0.0;
    g.connect(master);
    for (const f of freqs) {
        const o = ctx.createOscillator();
        o.type = "sine";
        o.frequency.value = f;
        o.detune.value = (Math.random() - 0.5) * 6;
        o.connect(g);
        o.start();
    }
    return g;
}

// what the wall holds: a small bright bell, struck once, fading.
// each bell picks a note from a warm pentatonic ceiling — the things
// that keep arriving are all slightly different, all held the same.
function bell() {
    const scale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    const f = scale[Math.floor(Math.random() * scale.length)];
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = "sine";
    o.frequency.value = f;
    const o2 = ctx.createOscillator();
    o2.type = "sine";
    o2.frequency.value = f * 2.01; // the shimmer
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 4 + Math.random() * 3);
    o.connect(g); o2.connect(g);
    g.connect(master);
    o.start(t); o2.start(t);
    o.stop(t + 8); o2.stop(t + 8);
    bearing++;
    document.getElementById("count").textContent = "bearing " + bearing;
}

// every so often a heavier thing arrives: a low fifth under the drone.
// the wall takes it without comment.
function stone() {
    const t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = "triangle";
    o.frequency.value = 65.4; // C2 — the floor under everything
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.03, t + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 10);
    o.connect(g);
    g.connect(master);
    o.start(t); o.stop(t + 10);
}

function loop() {
    if (!running) return;
    // chimes arrive faster as the structure grows, but never frantic
    const interval = Math.max(900, 3200 - bearing * 90);
    setTimeout(() => { bell(); loop(); }, interval);
}

document.getElementById("play").addEventListener("click", async () => {
    if (!ctx) {
        ctx = new AudioContext();
        master = ctx.createGain();
        master.gain.value = 0.9;
        master.connect(ctx.destination);
        // C2, G2, C3 with slow beating — one wall, three grains
        droneGain = buildDrone([65.4, 98.0, 130.8]);
        droneGain.gain.linearRampToValueAtTime(0.07, ctx.currentTime + 6);
    }
    if (!running) {
        running = true;
        document.getElementById("play").textContent = "it holds.";
        document.getElementById("status").textContent = "the drone is under everything. the chimes are on top. neither asks the other to stop.";
        loop();
        // stones arrive rarely — the load grows
        setInterval(() => { if (running && Math.random() < 0.6) stone(); }, 13000);
    }
});
</script>
</body>
</html>
