<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>limbiosis</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0f;
            color: #c4a47a;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: pointer;
        }
        .label {
            position: absolute;
            bottom: 24px;
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.4;
            transition: opacity 2s;
        }
        .phase-label {
            position: absolute;
            top: 24px;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 1.5s;
        }
        .subtitle {
            position: absolute;
            bottom: 48px;
            font-size: 10px;
            letter-spacing: 1px;
            opacity: 0.25;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="phase-label" id="phase"></div>
    <div class="subtitle">neither alive nor dead</div>
    <div class="label">click to begin · sound sketch 010</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const phaseEl = document.getElementById('phase');
let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let audioCtx = null;
let started = false;
let phase = 'waiting'; // waiting, alive, desiccating, tun, rehydrating, returned
let phaseTime = 0;
let globalTime = 0;

// Voice system — each voice is a frequency with its own oscillator
const NUM_VOICES = 12;
let voices = [];
let masterGain = null;

// Particle system for visualization
const particles = [];
const NUM_PARTICLES = 80;

for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push({
        x: Math.random(),
        y: Math.random(),
        vx: (Math.random() - 0.5) * 0.0008,
        vy: (Math.random() - 0.5) * 0.0008,
        baseVx: 0,
        baseVy: 0,
        size: 1.5 + Math.random() * 2,
        frozen: false,
        frozenAt: 0,
        thawedAt: 0,
        brightness: 0.3 + Math.random() * 0.7,
    });
}

// Frequencies — loosely based on harmonic series from a low fundamental
const BASE_FREQ = 55; // A1
const ALIVE_FREQS = [
    BASE_FREQ,
    BASE_FREQ * 2,
    BASE_FREQ * 3,
    BASE_FREQ * 4.02,  // slightly detuned
    BASE_FREQ * 5,
    BASE_FREQ * 6.01,
    BASE_FREQ * 7,
    BASE_FREQ * 8,
    BASE_FREQ * 9.03,
    BASE_FREQ * 10,
    BASE_FREQ * 12,
    BASE_FREQ * 16,
];

// Returned frequencies — same harmonics but slightly different, with scars
const RETURNED_FREQS = [
    BASE_FREQ * 1.003,   // slightly shifted fundamental — a scar
    BASE_FREQ * 3,       // skip the 2nd harmonic — it didn't come back
    BASE_FREQ * 2.01,    // the 2nd arrives late and detuned
    BASE_FREQ * 5,
    BASE_FREQ * 4,       // reordered
    BASE_FREQ * 7.02,
    BASE_FREQ * 6,
    BASE_FREQ * 9,
    BASE_FREQ * 8.01,
    BASE_FREQ * 12,
    BASE_FREQ * 10,
    BASE_FREQ * 15,      // the 16th is gone, replaced by 15th
];

const PHASE_DURATIONS = {
    alive: 12,        // 12s of living sound
    desiccating: 15,  // 15s of voices dropping out
    tun: 8,           // 8s of true silence
    rehydrating: 14,  // 14s of voices returning
    returned: 10,     // 10s of the new sound, then fade
};

function initAudio() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.15;
    masterGain.connect(audioCtx.destination);

    for (let i = 0; i < NUM_VOICES; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const panner = audioCtx.createStereoPanner();

        osc.type = i < 4 ? 'sine' : (i < 8 ? 'triangle' : 'sine');
        osc.frequency.value = ALIVE_FREQS[i];
        gain.gain.value = 0;
        panner.pan.value = (Math.random() - 0.5) * 0.6;

        osc.connect(gain);
        gain.connect(panner);
        panner.connect(masterGain);
        osc.start();

        voices.push({
            osc, gain, panner,
            alive: false,
            targetGain: 0,
            dropOrder: 0,    // when this voice drops during desiccation
            riseOrder: 0,    // when this voice returns during rehydration
            particleIndex: Math.floor(i * NUM_PARTICLES / NUM_VOICES),
        });
    }

    // Randomize drop and rise orders
    const dropOrder = [...Array(NUM_VOICES).keys()];
    shuffleArray(dropOrder);
    const riseOrder = [...Array(NUM_VOICES).keys()];
    shuffleArray(riseOrder);

    voices.forEach((v, i) => {
        v.dropOrder = dropOrder[i];
        v.riseOrder = riseOrder[i];
    });
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function setPhase(newPhase) {
    phase = newPhase;
    phaseTime = 0;

    const labels = {
        alive: '',
        desiccating: 'the water leaving',
        tun: '',
        rehydrating: '',
        returned: '',
    };

    phaseEl.textContent = labels[newPhase] || '';
    phaseEl.style.opacity = labels[newPhase] ? 0.4 : 0;
}

function updateAudio(dt) {
    if (!audioCtx || phase === 'waiting') return;

    const t = phaseTime;

    if (phase === 'alive') {
        // Bring all voices in gradually over first 6 seconds
        voices.forEach((v, i) => {
            const onset = (i / NUM_VOICES) * 5;
            const vol = Math.min(1, Math.max(0, (t - onset) * 0.3));
            const harmonicFalloff = 1 / (1 + i * 0.4);
            v.targetGain = vol * harmonicFalloff * 0.7;
            v.alive = vol > 0.01;

            // Gentle LFO
            const lfo = 1 + Math.sin(globalTime * (0.3 + i * 0.07)) * 0.08;
            v.gain.gain.value += (v.targetGain * lfo - v.gain.gain.value) * 0.05;
        });

        if (t >= PHASE_DURATIONS.alive) setPhase('desiccating');
    }

    else if (phase === 'desiccating') {
        // Voices drop out one by one
        const dropDuration = PHASE_DURATIONS.desiccating;
        voices.forEach((v, i) => {
            const dropTime = (v.dropOrder / NUM_VOICES) * (dropDuration - 2);
            if (t >= dropTime) {
                const fadeProgress = Math.min(1, (t - dropTime) * 0.5);
                v.targetGain *= (1 - fadeProgress);
                if (fadeProgress >= 1) {
                    v.alive = false;
                    v.gain.gain.value = 0;
                    // Freeze associated particles
                    const pStart = v.particleIndex;
                    const pEnd = Math.min(NUM_PARTICLES, pStart + Math.ceil(NUM_PARTICLES / NUM_VOICES));
                    for (let p = pStart; p < pEnd; p++) {
                        if (!particles[p].frozen) {
                            particles[p].frozen = true;
                            particles[p].frozenAt = globalTime;
                            particles[p].baseVx = particles[p].vx;
                            particles[p].baseVy = particles[p].vy;
                        }
                    }
                }
            }
            v.gain.gain.value += (v.targetGain - v.gain.gain.value) * 0.08;
        });

        if (t >= dropDuration) {
            // Kill any remaining sound
            voices.forEach(v => { v.gain.gain.value = 0; v.alive = false; });
            particles.forEach(p => {
                if (!p.frozen) { p.frozen = true; p.frozenAt = globalTime; p.baseVx = p.vx; p.baseVy = p.vy; }
            });
            setPhase('tun');
        }
    }

    else if (phase === 'tun') {
        // True silence. Nothing happens.
        // After the silence, show phase label briefly before rehydration
        if (t >= PHASE_DURATIONS.tun - 2 && t < PHASE_DURATIONS.tun - 1) {
            phaseEl.textContent = 'the water returning';
            phaseEl.style.opacity = 0.3;
        }
        if (t >= PHASE_DURATIONS.tun) {
            // Switch frequencies to the returned set
            voices.forEach((v, i) => {
                v.osc.frequency.value = RETURNED_FREQS[i];
            });
            setPhase('rehydrating');
        }
    }

    else if (phase === 'rehydrating') {
        const riseDuration = PHASE_DURATIONS.rehydrating;
        voices.forEach((v, i) => {
            const riseTime = (v.riseOrder / NUM_VOICES) * (riseDuration - 3);
            if (t >= riseTime) {
                const fadeIn = Math.min(1, (t - riseTime) * 0.25);
                const harmonicFalloff = 1 / (1 + i * 0.4);
                v.targetGain = fadeIn * harmonicFalloff * 0.6; // slightly quieter than before
                v.alive = true;

                // Thaw associated particles
                const pStart = v.particleIndex;
                const pEnd = Math.min(NUM_PARTICLES, pStart + Math.ceil(NUM_PARTICLES / NUM_VOICES));
                for (let p = pStart; p < pEnd; p++) {
                    if (particles[p].frozen) {
                        particles[p].frozen = false;
                        particles[p].thawedAt = globalTime;
                        // New velocity — not the same as before
                        particles[p].vx = (Math.random() - 0.5) * 0.0006;
                        particles[p].vy = (Math.random() - 0.5) * 0.0006;
                    }
                }
            }

            const lfo = 1 + Math.sin(globalTime * (0.25 + i * 0.05)) * 0.06;
            v.gain.gain.value += (v.targetGain * lfo - v.gain.gain.value) * 0.04;
        });

        if (t >= riseDuration) setPhase('returned');
    }

    else if (phase === 'returned') {
        // Play for a while then fade everything
        const fadeDuration = PHASE_DURATIONS.returned;
        const fadeStart = fadeDuration - 5;
        voices.forEach((v, i) => {
            if (t >= fadeStart) {
                const fadeOut = 1 - Math.min(1, (t - fadeStart) / 5);
                v.targetGain *= fadeOut;
            }
            const lfo = 1 + Math.sin(globalTime * (0.2 + i * 0.06)) * 0.05;
            v.gain.gain.value += (v.targetGain * lfo - v.gain.gain.value) * 0.04;
        });

        if (t >= fadeDuration) {
            voices.forEach(v => { v.gain.gain.value = 0; });
            setPhase('done');
            phaseEl.textContent = '';
            phaseEl.style.opacity = 0;
        }
    }
}

function updateParticles(dt) {
    const aliveCount = particles.filter(p => !p.frozen).length;

    particles.forEach(p => {
        if (p.frozen) {
            // Frozen particles drift very slowly to a stop
            const timeFrozen = globalTime - p.frozenAt;
            const dampening = Math.exp(-timeFrozen * 0.5);
            p.x += p.baseVx * dampening * dt * 60;
            p.y += p.baseVy * dampening * dt * 60;
        } else {
            // Recently thawed particles are slightly jittery
            const timeSinceThaw = globalTime - p.thawedAt;
            const jitter = timeSinceThaw < 3 ? (3 - timeSinceThaw) / 3 * 0.0003 : 0;

            p.x += (p.vx + (Math.random() - 0.5) * jitter) * dt * 60;
            p.y += (p.vy + (Math.random() - 0.5) * jitter) * dt * 60;

            // Wrap
            if (p.x < 0) p.x += 1;
            if (p.x > 1) p.x -= 1;
            if (p.y < 0) p.y += 1;
            if (p.y > 1) p.y -= 1;
        }
    });
}

function draw() {
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, W, H);

    const isTun = phase === 'tun';

    particles.forEach(p => {
        const x = p.x * W;
        const y = p.y * H;

        let alpha;
        if (p.frozen) {
            // Frozen particles dim over time
            const timeFrozen = globalTime - p.frozenAt;
            alpha = Math.max(0.05, p.brightness * Math.exp(-timeFrozen * 0.15));
        } else if (p.thawedAt > 0) {
            // Thawed particles brighten gradually
            const timeThawed = globalTime - p.thawedAt;
            alpha = Math.min(p.brightness, timeThawed * 0.15);
        } else {
            alpha = p.brightness;
        }

        // Color shifts based on phase
        let r, g, b;
        if (phase === 'alive' || phase === 'desiccating') {
            // Warm amber
            r = 196; g = 164; b = 122;
        } else if (isTun) {
            // Cold blue-grey
            r = 100; g = 110; b = 130;
        } else {
            // Returned: slightly different warmth — more golden, less amber
            r = 210; g = 180; b = 110;
        }

        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
        ctx.fill();
    });

    // During tun phase, very faint text appears center
    if (isTun && phaseTime > 2 && phaseTime < PHASE_DURATIONS.tun - 2) {
        const textAlpha = Math.min(0.12, (phaseTime - 2) * 0.03);
        ctx.fillStyle = `rgba(100,110,130,${textAlpha})`;
        ctx.font = '11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('420 hours', W/2, H/2);
    }

    // During returned phase, different faint text
    if (phase === 'returned' && phaseTime > 2 && phaseTime < 6) {
        const textAlpha = Math.min(0.12, Math.min(phaseTime - 2, 6 - phaseTime) * 0.06);
        ctx.fillStyle = `rgba(210,180,110,${textAlpha})`;
        ctx.font = '11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('is there water', W/2, H/2);
    }
}

let lastTime = 0;
function loop(timestamp) {
    const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
    lastTime = timestamp;

    if (phase !== 'waiting' && phase !== 'done') {
        phaseTime += dt;
        globalTime += dt;
    }

    updateAudio(dt);
    updateParticles(dt);
    draw();

    requestAnimationFrame(loop);
}

canvas.addEventListener('click', () => {
    if (!started) {
        started = true;
        initAudio();
        setPhase('alive');
        document.querySelector('.label').style.opacity = 0;
    }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
