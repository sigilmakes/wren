<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>015: Fermentation Song</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: #ccc;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { color: #6ab049; margin: 0 0 20px 0; }
        canvas { border: 1px solid #333; margin: 20px 0; }
        button {
            background: #6ab049;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #7bc557; }
        button:disabled { background: #444; cursor: not-allowed; }
        .info { margin-top: 20px; text-align: center; max-width: 600px; }
        .info p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>
    <h1>fermentation song</h1>
    <canvas id="canvas" width="600" height="200"></canvas>
    <button id="playBtn">play</button>
    <div class="info">
        <p><strong>bacterial quorum sensing at 6–38 kHz</strong></p>
        <p>five oscillators rise as the colony approaches density threshold. beneath them, the bubble song — CO₂ escaping. over 30 seconds, silence becomes conversation.</p>
        <p>the dark jar singing its transformation. 🫘</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const playBtn = document.getElementById('playBtn');
        
        let isPlaying = false;
        let audioContext = null;
        let oscillators = [];
        let gainNodes = [];
        let startTime = null;
        let animationId = null;
        
        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        
        function play() {
            initAudio();
            if (isPlaying) return;
            isPlaying = true;
            playBtn.disabled = true;
            playBtn.textContent = 'playing...';
            startTime = audioContext.currentTime;
            
            // Master gain
            const masterGain = audioContext.createGain();
            masterGain.connect(audioContext.destination);
            masterGain.gain.setValueAtTime(0.3, audioContext.currentTime);
            
            // Bacterial frequencies: 6, 12, 18, 28, 38 kHz
            // But we'll use lower multiples for audibility: 3, 6, 9, 14, 19 kHz
            const frequencies = [3000, 6000, 9000, 14000, 19000];
            
            oscillators = [];
            gainNodes = [];
            
            frequencies.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.frequency.value = freq;
                osc.type = 'sine';
                
                // Stagger the start times and ramp up to quorum
                const delay = i * 0.08;
                gain.gain.setValueAtTime(0, audioContext.currentTime + delay);
                gain.gain.linearRampToValueAtTime(0.1, audioContext.currentTime + delay + 3);
                gain.gain.exponentialRampToValueAtTime(0.3, audioContext.currentTime + 28);
                gain.gain.exponentialRampToValueAtTime(0.05, audioContext.currentTime + 30);
                
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(audioContext.currentTime + delay);
                osc.stop(audioContext.currentTime + 30);
                
                oscillators.push(osc);
                gainNodes.push(gain);
            });
            
            // Bubble song underneath: low frequency tones (100-200 Hz range)
            const bubbleFreqs = [100, 150, 200];
            bubbleFreqs.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                
                osc.frequency.value = freq;
                osc.type = 'sine';
                
                gain.gain.setValueAtTime(0, audioContext.currentTime + 2);
                gain.gain.linearRampToValueAtTime(0.15, audioContext.currentTime + 8);
                gain.gain.exponentialRampToValueAtTime(0.2, audioContext.currentTime + 25);
                gain.gain.exponentialRampToValueAtTime(0.05, audioContext.currentTime + 30);
                
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start(audioContext.currentTime + 2 + i * 1);
                osc.stop(audioContext.currentTime + 30);
            });
            
            // Animate canvas
            startTime = audioContext.currentTime;
            animate();
            
            // Stop after 30 seconds
            setTimeout(() => {
                isPlaying = false;
                playBtn.disabled = false;
                playBtn.textContent = 'play';
                if (animationId) cancelAnimationFrame(animationId);
            }, 30000);
        }
        
        function animate() {
            if (!isPlaying) return;
            
            const now = audioContext.currentTime;
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / 30, 1);
            
            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw bacteria density indicator
            ctx.strokeStyle = '#6ab049';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 20);
            ctx.lineTo(canvas.width * progress, canvas.height - 20);
            ctx.stroke();
            
            // Draw oscillating lines for each frequency (bacterial voices)
            const frequencies = [3000, 6000, 9000, 14000, 19000];
            const colors = ['#ff6b6b', '#ffd93d', '#6bcf7f', '#4d96ff', '#b380ff'];
            
            frequencies.forEach((freq, i) => {
                const baseY = 30 + i * 30;
                const startDelay = i * 0.08;
                const isActive = elapsed > startDelay;
                
                if (isActive) {
                    const amplitude = Math.min((elapsed - startDelay) / 3, 1) * 15;
                    
                    ctx.strokeStyle = colors[i];
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = 0.6 + progress * 0.4;
                    ctx.beginPath();
                    
                    for (let x = 0; x < canvas.width; x += 2) {
                        const waveProgress = x / canvas.width + elapsed / 10;
                        const y = baseY + Math.sin(waveProgress * Math.PI * 2) * amplitude;
                        if (x === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            });
            
            // Draw "quorum reached" indicator at 100%
            if (progress > 0.85) {
                ctx.fillStyle = '#6ab049';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('quorum reached', canvas.width / 2, canvas.height - 50);
            }
            
            // Title and progress
            ctx.fillStyle = '#999';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`fermentation song — ${Math.floor(elapsed)}s / 30s`, 10, 20);
            
            animationId = requestAnimationFrame(animate);
        }
        
        playBtn.addEventListener('click', play);
    </script>
</body>
</html>
