<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>022 — BAAAWK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
  }
  #title {
    font-size: 14px;
    color: #555;
    margin-bottom: 20px;
    letter-spacing: 2px;
  }
  #canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  #prompt {
    z-index: 1;
    font-size: 18px;
    color: #888;
    animation: pulse 2s ease-in-out infinite;
  }
  #count {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 12px;
    color: #333;
    z-index: 1;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="prompt">click to BAAAWK</div>
<div id="count"></div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const countEl = document.getElementById('count');
const promptEl = document.getElementById('prompt');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let audioCtx = null;
let baaawkCount = 0;
let activeBaaawks = [];
let phase = 0; // 0=single, 1=layering, 2=overwhelming, 3=dissolving, 4=silence
let totalBaaawks = 0;
let lastBaaawkTime = 0;
let autoMode = false;
let autoTimer = null;

// Visual particles for each BAAAWK
let particles = [];

class BaaawkParticle {
  constructor(x, y, size, color) {
    this.x = x || Math.random() * canvas.width;
    this.y = y || Math.random() * canvas.height;
    this.size = size || 12 + Math.random() * 20;
    this.opacity = 1;
    this.decay = 0.008 + Math.random() * 0.015;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.05;
    this.color = color || `hsl(${30 + Math.random() * 30}, ${60 + Math.random() * 30}%, ${50 + Math.random() * 30}%)`;
    this.text = 'BAAAWK';
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.opacity -= this.decay;
    this.rotation += this.rotSpeed;
    return this.opacity > 0;
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.font = `bold ${this.size}px Courier New`;
    ctx.fillStyle = this.color;
    ctx.globalAlpha = this.opacity;
    ctx.textAlign = 'center';
    ctx.fillText(this.text, 0, 0);
    ctx.restore();
  }
}

function makeBaaawk(pitch, volume, pan) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const dur = 0.15 + Math.random() * 0.15;

  // Main squawk — harsh square wave with quick pitch drop
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const panner = audioCtx.createStereoPanner();
  const filter = audioCtx.createBiquadFilter();

  const baseFreq = pitch || (800 + Math.random() * 600);

  osc.type = 'square';
  osc.frequency.setValueAtTime(baseFreq, now);
  osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + dur);

  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(baseFreq * 1.5, now);
  filter.Q.setValueAtTime(2 + Math.random() * 3, now);

  const vol = volume !== undefined ? volume : 0.12;
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(vol, now + 0.01);
  gain.gain.setValueAtTime(vol, now + dur * 0.3);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

  panner.pan.setValueAtTime(pan !== undefined ? pan : (Math.random() * 2 - 1), now);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(panner);
  panner.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + dur);

  // Noise burst for the "awk" part
  const bufferSize = audioCtx.sampleRate * dur;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
  }
  const noise = audioCtx.createBufferSource();
  const noiseGain = audioCtx.createGain();
  const noiseFilter = audioCtx.createBiquadFilter();
  noise.buffer = noiseBuffer;
  noiseFilter.type = 'highpass';
  noiseFilter.frequency.setValueAtTime(2000, now);
  noiseGain.gain.setValueAtTime(vol * 0.3, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(panner);
  noise.start(now);
  noise.stop(now + dur);

  return { osc, noise, endTime: now + dur };
}

function singleBaaawk() {
  const b = makeBaaawk();
  baaawkCount++;
  totalBaaawks++;

  // Add visual particle
  particles.push(new BaaawkParticle(
    canvas.width / 2 + (Math.random() - 0.5) * 100,
    canvas.height / 2 + (Math.random() - 0.5) * 100
  ));

  updateCount();
  checkPhase();
}

function layeredBaaawk() {
  const count = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      makeBaaawk(
        600 + Math.random() * 800,
        0.08 + Math.random() * 0.06,
        Math.random() * 2 - 1
      );
      particles.push(new BaaawkParticle(
        Math.random() * canvas.width,
        Math.random() * canvas.height,
        10 + Math.random() * 15
      ));
      baaawkCount++;
      totalBaaawks++;
      updateCount();
    }, i * (30 + Math.random() * 80));
  }
  checkPhase();
}

function overwhelmingBaaawk() {
  const count = 5 + Math.floor(Math.random() * 10);
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      makeBaaawk(
        300 + Math.random() * 1200,
        0.04 + Math.random() * 0.04,
        Math.random() * 2 - 1
      );
      particles.push(new BaaawkParticle(
        Math.random() * canvas.width,
        Math.random() * canvas.height,
        6 + Math.random() * 25,
        `hsl(${Math.random() * 360}, ${40 + Math.random() * 40}%, ${30 + Math.random() * 40}%)`
      ));
      baaawkCount++;
      totalBaaawks++;
      updateCount();
    }, i * (10 + Math.random() * 40));
  }
  checkPhase();
}

function dissolvingBaaawk() {
  // Quieter, slower, fading
  const vol = Math.max(0.01, 0.06 - (totalBaaawks - 80) * 0.001);
  makeBaaawk(
    200 + Math.random() * 300,
    vol,
    Math.random() * 2 - 1
  );
  particles.push(new BaaawkParticle(
    canvas.width / 2 + (Math.random() - 0.5) * canvas.width * 0.8,
    canvas.height / 2 + (Math.random() - 0.5) * canvas.height * 0.8,
    4 + Math.random() * 8,
    `hsl(220, 20%, ${20 + Math.random() * 20}%)`
  ));
  baaawkCount++;
  totalBaaawks++;
  updateCount();
  checkPhase();
}

function checkPhase() {
  if (totalBaaawks < 8) {
    phase = 0;
  } else if (totalBaaawks < 30) {
    phase = 1;
    if (!autoMode) startAuto();
  } else if (totalBaaawks < 80) {
    phase = 2;
  } else if (totalBaaawks < 120) {
    phase = 3;
  } else {
    phase = 4;
    stopAuto();
  }
}

function startAuto() {
  autoMode = true;
  function tick() {
    if (phase === 4) return;

    let delay;
    if (phase === 1) {
      layeredBaaawk();
      delay = 400 + Math.random() * 600;
    } else if (phase === 2) {
      overwhelmingBaaawk();
      delay = 100 + Math.random() * 300;
    } else if (phase === 3) {
      dissolvingBaaawk();
      delay = 800 + Math.random() * 1500;
    }

    autoTimer = setTimeout(tick, delay);
  }
  tick();
}

function stopAuto() {
  autoMode = false;
  if (autoTimer) clearTimeout(autoTimer);

  // Final silence — one last tiny baaawk
  setTimeout(() => {
    makeBaaawk(200, 0.02, 0);
    particles.push(new BaaawkParticle(
      canvas.width / 2,
      canvas.height / 2,
      30,
      'hsl(220, 10%, 40%)'
    ));
    totalBaaawks++;
    updateCount();

    // Show ending
    setTimeout(() => {
      promptEl.textContent = '...';
      promptEl.style.animation = 'none';
      promptEl.style.opacity = '0.3';
    }, 2000);
  }, 3000);
}

function updateCount() {
  countEl.textContent = totalBaaawks;
}

// Animation loop
function animate() {
  ctx.fillStyle = `rgba(10, 10, 10, ${phase >= 3 ? 0.15 : 0.08})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles = particles.filter(p => {
    const alive = p.update();
    if (alive) p.draw(ctx);
    return alive;
  });

  requestAnimationFrame(animate);
}
animate();

// Click handler
document.body.addEventListener('click', () => {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if (phase === 4) {
    // Reset
    totalBaaawks = 0;
    baaawkCount = 0;
    phase = 0;
    autoMode = false;
    particles = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    promptEl.textContent = 'click to BAAAWK';
    promptEl.style.animation = 'pulse 2s ease-in-out infinite';
    promptEl.style.opacity = '';
    updateCount();
    return;
  }

  promptEl.style.display = 'none';
  singleBaaawk();
});
</script>
</body>
</html>
