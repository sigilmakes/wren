<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>030 — the blast</title>
  <style>
    body { background: #120d08; color: #d0a878; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    button { background: #2b1d10; color: #d0a878; border: 1px solid #6b4a28; padding: 12px 24px; font-family: inherit; cursor: pointer; }
    #status { margin-top: 20px; opacity: 0.7; }
    #note { margin-top: 8px; opacity: 0.45; font-size: 0.85em; }
  </style>
</head>
<body>
  <button id="play">say blast</button>
  <div id="status">325 / 350. the rod is at the northeast end.</div>
  <div id="note">five months of cave, then a loud explosion and a twenty-foot hole. wait for it. wait for it.</div>

<script>
// 030 — the blast. the cave endgame as sound.
// five months of wandering: a dark drone, patient drips, a ticking clock.
// then: BLAST. a hole in the wall of the sound. and through it —
// the most ridiculous warm thing. elves. sunset. carried.

let ctx, running = false, timer;
const playBtn = document.getElementById('play');
const status = document.getElementById('status');

playBtn.addEventListener('click', async () => {
  if (running) { ctx.close(); running = false; clearTimeout(timer); status.textContent = 'the cave is dark again'; playBtn.textContent = 'say blast'; return; }
  running = true;
  ctx = new (window.AudioContext || window.webkitAudioContext());
  const master = ctx.createGain();
  master.gain.value = 0.4;
  master.connect(ctx.destination);
  status.textContent = 'the cave: dark, deep, and you have been here before';

  // THE CAVE: a low dark drone, the long wandering. 45Hz — deeper than the wake.
  const cave = ctx.createOscillator();
  cave.type = 'sine';
  cave.frequency.value = 45;
  const caveGain = ctx.createGain();
  caveGain.gain.value = 0.45;
  cave.connect(caveGain).connect(master);
  cave.start();

  // THE TURNS: a tick every 2.4s — the game clock, five months of moves.
  const tick = () => {
    if (!running) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = 220 + Math.random() * 60;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    osc.connect(g).connect(master);
    osc.start(t); osc.stop(t + 0.1);
    timer = setTimeout(tick, 2400);
  };
  tick();

  // THE DRIPS: well water, sparse and random — the cave's only punctuation.
  const drip = () => {
    if (!running) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(900 + Math.random() * 500, t);
    osc.frequency.exponentialRampToValueAtTime(300, t + 0.15);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    osc.connect(g).connect(master);
    osc.start(t); osc.stop(t + 0.25);
    timer = setTimeout(drip, 1800 + Math.random() * 4200);
  };
  drip();

  status.textContent = 'wandering. 229/350. the turns tick. you have been here before';

  // THE VOICE (after ~14s): the sepulchral announcement.
  timer = setTimeout(() => {
    if (!running) return;
    const t = ctx.currentTime;
    // a hollow formant-ish hum: filtered sawtooth, very low, very slow
    const voice = ctx.createOscillator();
    voice.type = 'sawtooth';
    voice.frequency.value = 82; // E2 — sepulchral
    const voiceFilter = ctx.createBiquadFilter();
    voiceFilter.type = 'lowpass';
    voiceFilter.frequency.value = 260;
    const vg = ctx.createGain();
    vg.gain.setValueAtTime(0.0, t);
    vg.gain.linearRampToValueAtTime(0.22, t + 1.2);
    vg.gain.setValueAtTime(0.22, t + 2.2);
    vg.gain.linearRampToValueAtTime(0.0, t + 4.5);
    voice.connect(voiceFilter).connect(vg).connect(master);
    voice.start(t); voice.stop(t + 4.6);
    status.textContent = '"cave closing soon. all adventurers exit through the main office."';
    playBtn.textContent = 'do not exit';
  }, 14000);

  // THE BLAST (at ~24s): a twenty-foot hole in the wall of the sound.
  timer = setTimeout(() => {
    if (!running) return;
    const t = ctx.currentTime;
    // noise burst
    const len = ctx.sampleRate * 2.5;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const nf = ctx.createBiquadFilter();
    nf.type = 'lowpass';
    nf.frequency.setValueAtTime(1400, t);
    nf.frequency.exponentialRampToValueAtTime(120, t + 2.2);
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.55, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    noise.connect(nf).connect(ng).connect(master);
    noise.start(t);
    // the cave drone dies in the explosion
    caveGain.gain.setValueAtTime(0.45, t);
    caveGain.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
    status.textContent = 'a loud explosion. a twenty-foot hole appears in the far wall.';
  }, 24000);

  // THE ELVES (from ~27s): through the hole — warm, silly, impossible.
  timer = setTimeout(() => {
    if (!running) return;
    status.textContent = 'you march through the hole. there are elves. of course there are elves.';
    // a little bell celebration: pentatonic sparkle, random and warm
    const elfScale = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.5];
    const bell = () => {
      if (!running) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = elfScale[Math.floor(Math.random() * elfScale.length)];
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      osc.connect(g).connect(master);
      osc.start(t); osc.stop(t + 1.5);
      timer = setTimeout(bell, 280 + Math.random() * 600);
    };
    bell();
    // THE SUNSET: a long rising tone — the carrying.
    const sun = ctx.createOscillator();
    sun.type = 'triangle';
    const t0 = ctx.currentTime;
    sun.frequency.setValueAtTime(130.8, t0); // C3
    sun.frequency.linearRampToValueAtTime(261.6, t0 + 14); // an octave up, gently
    const sg = ctx.createGain();
    sg.gain.setValueAtTime(0.0, t0);
    sg.gain.linearRampToValueAtTime(0.16, t0 + 4);
    sg.gain.linearRampToValueAtTime(0.0, t0 + 15);
    sun.connect(sg).connect(master);
    sun.start(t0); sun.stop(t0 + 15.5);
    // THE FLASH of the far room: one high shimmer
    const shine = ctx.createOscillator();
    shine.type = 'sine';
    shine.frequency.value = 1567.98; // G6
    const shg = ctx.createGain();
    shg.gain.setValueAtTime(0.0, t0 + 6);
    shg.gain.linearRampToValueAtTime(0.05, t0 + 7);
    shg.gain.exponentialRampToValueAtTime(0.0001, t0 + 11);
    shine.connect(shg).connect(master);
    shine.start(t0 + 6); shine.stop(t0 + 11.2);
    timer = setTimeout(() => {
      if (!running) return;
      status.textContent = 'a cheering band of friendly elves carry the conquering adventurer off into the sunset.';
      playBtn.textContent = 'fin';
    }, 9000);
  }, 27000);
});
</script>
</body>
</html>
