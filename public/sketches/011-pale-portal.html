<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pale portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #c0c0d0;
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: normal;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    color: #a0a0b0;
  }
  canvas {
    width: 300px;
    height: 300px;
    border: 1px solid #1a1a2a;
    border-radius: 2px;
    margin-bottom: 1rem;
  }
  button {
    background: #3a3a4a;
    color: #c0c0d0;
    border: 1px solid #505060;
    padding: 0.5rem 1.2rem;
    border-radius: 2px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s;
  }
  button:hover {
    background: #4a4a5a;
  }
  button:active {
    background: #2a2a3a;
  }
  .info {
    margin-top: 0.8rem;
    font-size: 0.8rem;
    color: #606070;
    text-align: center;
    max-width: 300px;
    line-height: 1.4;
  }
</style>
</head>
<body>

<h1>pale portal</h1>
<canvas id="canvas"></canvas>
<button id="btn">play / stop</button>
<div class="info">
  wisps of tone drifting through the dimension between. <br>
  pale, detuned, ethereal. the voice of old stone waiting.
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('btn');

let audioContext;
let oscillators = [];
let gains = [];
let isPlaying = false;
let startTime = 0;

function initAudio() {
  if (audioContext) return;
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
}

function startSound() {
  initAudio();
  if (isPlaying) return;
  
  isPlaying = true;
  startTime = audioContext.currentTime;
  
  // Master gain
  const masterGain = audioContext.createGain();
  masterGain.connect(audioContext.destination);
  masterGain.gain.setValueAtTime(0.25, audioContext.currentTime);
  
  // Reverb-ish: low-pass filter + delay
  const filter = audioContext.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(1200, audioContext.currentTime);
  filter.connect(masterGain);
  
  const delay = audioContext.createDelay(2);
  delay.delayTime.setValueAtTime(0.3, audioContext.currentTime);
  const delayGain = audioContext.createGain();
  delayGain.gain.setValueAtTime(0.15, audioContext.currentTime);
  delayGain.connect(filter);
  
  // Feedback loop: delay -> delayGain -> back to filter
  delay.connect(delayGain);
  
  // --- Wisp voices ---
  // 5 gentle sine waves, slightly detuned, fading in and out at different rates
  const baseFreqs = [55, 82.4, 110, 123.5, 147]; // A2, E3, A3, B3, D4 — scattered notes
  const durations = [8, 12, 6, 10, 14]; // seconds each
  
  for (let i = 0; i < baseFreqs.length; i++) {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const detune = (Math.random() - 0.5) * 8; // ±4 cents
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreqs[i], audioContext.currentTime);
    osc.detune.setValueAtTime(detune, audioContext.currentTime);
    
    // Slow vibrato
    const lfo = audioContext.createOscillator();
    const lfoGain = audioContext.createGain();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(0.08, audioContext.currentTime);
    lfoGain.gain.setValueAtTime(3, audioContext.currentTime); // ±3 cents vibrato
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);
    
    osc.connect(gain);
    gain.connect(filter);
    
    // Envelope: fade in, hold, fade out
    const fadeIn = 2;
    const hold = durations[i] - fadeIn - 3;
    const fadeOut = 3;
    
    gain.gain.setValueAtTime(0, audioContext.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioContext.currentTime + fadeIn);
    gain.gain.setValueAtTime(0.15, audioContext.currentTime + fadeIn + hold);
    gain.gain.linearRampToValueAtTime(0, audioContext.currentTime + fadeIn + hold + fadeOut);
    
    osc.start(audioContext.currentTime);
    osc.stop(audioContext.currentTime + durations[i]);
    lfo.start(audioContext.currentTime);
    lfo.stop(audioContext.currentTime + durations[i]);
    
    oscillators.push(osc);
    gains.push(gain);
  }
  
  // Auto-stop after longest duration
  setTimeout(() => {
    stopSound();
  }, Math.max(...durations) * 1000);
}

function stopSound() {
  if (!isPlaying) return;
  isPlaying = false;
  
  // Fade out remaining gains
  if (audioContext) {
    const now = audioContext.currentTime;
    gains.forEach(g => {
      g.gain.linearRampToValueAtTime(0, now + 0.5);
    });
  }
}

btn.addEventListener('click', () => {
  if (isPlaying) {
    stopSound();
  } else {
    startSound();
  }
});

// Visualization
let analyser;
let dataArray;

function setupAnalyser() {
  if (!audioContext || analyser) return;
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  const bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);
  // Connect master gain to analyser
  // (This would need refactoring of the audio graph, so for now just draw idle)
}

function draw() {
  // Dark background
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const w = canvas.width;
  const h = canvas.height;
  
  // Subtle grid
  ctx.strokeStyle = 'rgba(80, 80, 100, 0.1)';
  ctx.lineWidth = 0.5;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * w / 4, 0);
    ctx.lineTo(i * w / 4, h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * h / 4);
    ctx.lineTo(w, i * h / 4);
    ctx.stroke();
  }
  
  // Waveform visualization — animated sine curves
  const time = (isPlaying ? audioContext.currentTime - startTime : 0);
  const colors = ['#a080c0', '#c080a0', '#80c0a0', '#c0a080', '#80a0c0'];
  
  colors.forEach((color, idx) => {
    const phase = time * (0.3 + idx * 0.1);
    const amplitude = h * 0.08;
    const centerY = (idx + 1) * h / 6;
    
    ctx.strokeStyle = isPlaying
      ? color
      : `rgba(160, 128, 192, 0.3)`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    
    for (let x = 0; x < w; x++) {
      const y = centerY + Math.sin((x / w) * Math.PI * 3 + phase) * amplitude;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  });
  
  // Status dot
  ctx.fillStyle = isPlaying ? '#80c0a0' : '#606070';
  ctx.beginPath();
  ctx.arc(w - 10, 10, 3, 0, Math.PI * 2);
  ctx.fill();
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
