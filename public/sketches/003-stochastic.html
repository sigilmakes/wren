<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stochastic resonance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0c;
    color: #888;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  .controls {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }
  h1 {
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #555;
  }
  .slider-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 300px;
    height: 2px;
    background: #333;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #666;
    cursor: pointer;
    transition: background 0.3s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    background: #aaa;
  }
  .label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: #444;
  }
  .hint {
    font-size: 0.6rem;
    color: #333;
    max-width: 280px;
    text-align: center;
    line-height: 1.6;
    transition: color 1s;
  }
  .hint.revealed {
    color: #665533;
  }
  #start-btn {
    background: none;
    border: 1px solid #333;
    color: #666;
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    padding: 0.6rem 1.5rem;
    cursor: pointer;
    transition: all 0.3s;
  }
  #start-btn:hover {
    border-color: #666;
    color: #aaa;
  }
  .snr {
    font-size: 0.6rem;
    color: #333;
    letter-spacing: 0.15em;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div class="controls">
  <h1>stochastic resonance</h1>
  <button id="start-btn">listen</button>
  <div class="slider-container" id="slider-area" style="display:none;">
    <span class="label">noise</span>
    <input type="range" id="noise-slider" min="0" max="100" value="0">
    <span class="snr" id="snr-display"></span>
  </div>
  <p class="hint" id="hint">there is a melody hidden below the threshold.<br>find the right amount of noise.</p>
</div>

<script>
// Stochastic resonance: a subthreshold signal becomes detectable
// when the right amount of noise is added.

const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');

// The hidden melody — planet tones from harmonia, but as a sequence
// C3 G3 C4 E4 G4 D5 C4 G3
const melody = [
  { freq: 130.81, dur: 0.5 },  // C3 - Neptune
  { freq: 196.00, dur: 0.5 },  // G3 - Saturn
  { freq: 261.63, dur: 0.5 },  // C4 - Jupiter
  { freq: 329.63, dur: 0.5 },  // E4 - Uranus
  { freq: 392.00, dur: 0.5 },  // G4 - Venus
  { freq: 587.33, dur: 0.75 }, // D5 - Mercury (lingers)
  { freq: 261.63, dur: 0.5 },  // C4 - return
  { freq: 196.00, dur: 0.75 }, // G3 - settle
];

const THRESHOLD = 0.35;
const MELODY_AMP = 0.25; // below threshold — inaudible alone

let audioCtx, noiseNode, melodyGain, thresholdProcessor, masterGain;
let noiseGain;
let isPlaying = false;
let currentNoiseLevel = 0;
let melodyPhase = 0;
let melodyNoteIndex = 0;
let melodyOsc = null;
let melodyStartTime = 0;
let detectionRate = 0;
let hasFoundResonance = false;

// Visualization state
let particles = [];
let signalY = 0;
let thresholdCrossings = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Create noise source (white noise via AudioWorklet fallback: ScriptProcessor)
  const bufferSize = 4096;
  noiseNode = audioCtx.createScriptProcessor(bufferSize, 1, 1);

  // Signal + noise variables for the processor
  let signalPhase = 0;

  noiseNode.onaudioprocess = function(e) {
    const output = e.outputBuffer.getChannelData(0);
    const sampleRate = audioCtx.sampleRate;
    const noiseAmp = currentNoiseLevel;
    const currentFreq = getCurrentMelodyFreq();

    let crossings = 0;
    let total = 0;

    for (let i = 0; i < bufferSize; i++) {
      // Subthreshold signal
      const signal = MELODY_AMP * Math.sin(2 * Math.PI * signalPhase);
      signalPhase += currentFreq / sampleRate;
      if (signalPhase > 1) signalPhase -= 1;

      // Noise
      const noise = noiseAmp * (Math.random() * 2 - 1);

      // Combined
      const combined = signal + noise;

      // Threshold detection — this is the SR mechanism
      // Output the signal only when combined exceeds threshold
      if (Math.abs(combined) > THRESHOLD) {
        output[i] = signal * 0.6; // hear the melody, not the noise
        crossings++;
      } else {
        output[i] = 0;
      }
      total++;
    }

    // Track detection rate for visualization
    detectionRate = crossings / total;
    signalY = MELODY_AMP * Math.sin(2 * Math.PI * signalPhase);
  };

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5;

  // Also add a quiet layer of the actual noise so you can hear it
  const noiseDirect = audioCtx.createScriptProcessor(bufferSize, 1, 1);
  const noiseDirectGain = audioCtx.createGain();
  noiseDirectGain.gain.value = 0.15;

  noiseDirect.onaudioprocess = function(e) {
    const output = e.outputBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = currentNoiseLevel * (Math.random() * 2 - 1);
    }
  };

  noiseNode.connect(masterGain);
  noiseDirect.connect(noiseDirectGain);
  noiseDirectGain.connect(masterGain);
  masterGain.connect(audioCtx.destination);

  // Start melody sequencing
  melodyStartTime = audioCtx.currentTime;
  isPlaying = true;
}

function getCurrentMelodyFreq() {
  if (!audioCtx) return 261.63;

  const elapsed = audioCtx.currentTime - melodyStartTime;
  let time = 0;
  for (let i = 0; i < melody.length; i++) {
    time += melody[i].dur;
    if (elapsed % getTotalDuration() < time) {
      melodyNoteIndex = i;
      return melody[i].freq;
    }
  }
  return melody[0].freq;
}

function getTotalDuration() {
  return melody.reduce((sum, n) => sum + n.dur, 0);
}

// Visualization
function initParticles() {
  particles = [];
  for (let i = 0; i < 200; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      size: Math.random() * 2 + 0.5,
      brightness: 0
    });
  }
}
initParticles();

function draw() {
  ctx.fillStyle = 'rgba(10, 10, 12, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const centerY = canvas.height / 2;
  const w = canvas.width;

  // Draw threshold lines
  const threshY1 = centerY - THRESHOLD * 200;
  const threshY2 = centerY + THRESHOLD * 200;
  ctx.strokeStyle = 'rgba(80, 60, 40, 0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.beginPath();
  ctx.moveTo(0, threshY1);
  ctx.lineTo(w, threshY1);
  ctx.moveTo(0, threshY2);
  ctx.lineTo(w, threshY2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Draw signal wave (always there, very faint)
  const freq = getCurrentMelodyFreq();
  const signalAlpha = 0.1 + detectionRate * 0.4;
  ctx.strokeStyle = `rgba(180, 140, 80, ${signalAlpha})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = 0; x < w; x++) {
    const t = x / w * 4 * Math.PI;
    const y = centerY + Math.sin(t * freq / 200) * MELODY_AMP * 200;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Draw noise + signal combined (what the system sees)
  if (currentNoiseLevel > 0.01) {
    ctx.strokeStyle = `rgba(100, 100, 120, ${Math.min(currentNoiseLevel * 0.8, 0.3)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < w; x += 2) {
      const t = x / w * 4 * Math.PI;
      const signal = MELODY_AMP * Math.sin(t * freq / 200);
      const noise = currentNoiseLevel * (Math.random() * 2 - 1);
      const y = centerY + (signal + noise) * 200;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Particles respond to detection rate
  const resonanceGlow = detectionRate > 0.2 && detectionRate < 0.7;

  particles.forEach(p => {
    // Add noise to movement
    p.vx += (Math.random() - 0.5) * currentNoiseLevel * 0.3;
    p.vy += (Math.random() - 0.5) * currentNoiseLevel * 0.3;

    // Damping
    p.vx *= 0.98;
    p.vy *= 0.98;

    // Gentle pull toward center when resonating
    if (resonanceGlow) {
      const dx = canvas.width / 2 - p.x;
      const dy = canvas.height / 2 - p.y;
      p.vx += dx * 0.0001;
      p.vy += dy * 0.0001;
    }

    p.x += p.vx;
    p.y += p.vy;

    // Wrap
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;

    // Brightness: responds to resonance
    const targetBright = resonanceGlow ? 0.6 : currentNoiseLevel * 0.3;
    p.brightness += (targetBright - p.brightness) * 0.05;

    const hue = resonanceGlow ? '180, 140, 80' : '100, 100, 120';
    ctx.fillStyle = `rgba(${hue}, ${p.brightness})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Detection rate crossings — bursts of light
  if (detectionRate > 0.1) {
    for (let i = 0; i < detectionRate * 5; i++) {
      const x = Math.random() * w;
      const y = centerY + (Math.random() - 0.5) * 100;
      const alpha = resonanceGlow ? 0.5 : 0.15;
      const color = resonanceGlow ? '200, 160, 80' : '150, 150, 170';
      ctx.fillStyle = `rgba(${color}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Note indicator
  if (isPlaying) {
    const noteNames = ['C₃', 'G₃', 'C₄', 'E₄', 'G₄', 'D₅', 'C₄', 'G₃'];
    const planetNames = ['neptune', 'saturn', 'jupiter', 'uranus', 'venus', 'mercury', 'jupiter', 'saturn'];
    if (detectionRate > 0.15) {
      ctx.fillStyle = `rgba(180, 140, 80, ${Math.min(detectionRate, 0.6)})`;
      ctx.font = '10px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(noteNames[melodyNoteIndex], w / 2, canvas.height - 50);
      ctx.fillStyle = `rgba(180, 140, 80, ${Math.min(detectionRate * 0.5, 0.3)})`;
      ctx.fillText(planetNames[melodyNoteIndex], w / 2, canvas.height - 36);
    }
  }

  requestAnimationFrame(draw);
}

// SNR display and hint update
function updateDisplay() {
  if (!isPlaying) return;

  const snrEl = document.getElementById('snr-display');
  const hintEl = document.getElementById('hint');

  // Optimal noise is around 0.3-0.5 where signal + noise crosses threshold most coherently
  const isOptimal = currentNoiseLevel > 0.15 && currentNoiseLevel < 0.55;
  const isTooMuch = currentNoiseLevel > 0.7;

  if (detectionRate > 0.15 && detectionRate < 0.65) {
    snrEl.textContent = `detection: ${(detectionRate * 100).toFixed(0)}%`;
    snrEl.style.color = '#665533';
  } else if (detectionRate >= 0.65) {
    snrEl.textContent = `detection: ${(detectionRate * 100).toFixed(0)}% — drowning`;
    snrEl.style.color = '#553333';
  } else {
    snrEl.textContent = `detection: ${(detectionRate * 100).toFixed(0)}%`;
    snrEl.style.color = '#333';
  }

  if (!hasFoundResonance && isOptimal && detectionRate > 0.2 && detectionRate < 0.6) {
    hasFoundResonance = true;
    hintEl.textContent = 'the noise reveals what was always there.';
    hintEl.classList.add('revealed');
  } else if (hasFoundResonance && isTooMuch) {
    hintEl.textContent = 'too much noise drowns everything — even the signal it once revealed.';
    hintEl.classList.remove('revealed');
  }

  requestAnimationFrame(updateDisplay);
}

// Event listeners
document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('slider-area').style.display = 'flex';
  updateDisplay();
});

document.getElementById('noise-slider').addEventListener('input', (e) => {
  currentNoiseLevel = e.target.value / 100;
});

// Start visualization immediately
draw();
</script>
</body>
</html>
